<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neon Orbit Tic Tac Toe</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    width:100%;
    min-height:100vh;
    overflow:hidden;
    background:#050816;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    color:white;
}

body::before{
    content:"";
    position:absolute;
    width:120vw;
    height:120vw;
    background:conic-gradient(from 0deg,#00f7ff,#ff00ea,#00ff99,#00f7ff);
    animation:spin 10s linear infinite;
    filter:blur(120px);
    opacity:0.18;
}

@keyframes spin{
    100%{transform:rotate(360deg);}
}

.game-wrapper{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    position:relative;
    z-index:2;
}

.game-box{
    width:min(100%,500px);
    height:min(96vh,820px);
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    backdrop-filter:blur(20px);
    border-radius:32px;
    box-shadow:0 0 40px rgba(0,247,255,0.15);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
    padding:22px;
}

.title{
    text-align:center;
    margin-top:5px;
}

.title h1{
    font-size:clamp(2rem,5vw,3.2rem);
    background:linear-gradient(90deg,#00f7ff,#ff00ea);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    letter-spacing:3px;
}

.title p{
    margin-top:6px;
    color:#d9dcff;
    font-size:0.95rem;
}

.status{
    margin-top:12px;
    font-size:clamp(1rem,3vw,1.4rem);
    font-weight:bold;
    text-align:center;
    color:#ffffff;
    min-height:30px;
}

.board{
    width:100%;
    max-width:420px;
    aspect-ratio:1/1;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin:auto 0;
}

.cell{
    background:rgba(255,255,255,0.05);
    border:2px solid rgba(255,255,255,0.08);
    border-radius:24px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:clamp(2.5rem,10vw,5rem);
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:0.25s ease;
    user-select:none;
}

.cell:hover{
    transform:translateY(-3px) scale(1.02);
    border-color:#00f7ff;
    box-shadow:0 0 25px rgba(0,247,255,0.35);
}

.cell::before{
    content:"";
    position:absolute;
    inset:-50%;
    background:linear-gradient(45deg,transparent,rgba(255,255,255,0.15),transparent);
    transform:translateX(-100%) rotate(45deg);
}

.cell:hover::before{
    animation:shine 0.8s linear;
}

@keyframes shine{
    to{
        transform:translateX(100%) rotate(45deg);
    }
}

.x{
    color:#00f7ff;
    text-shadow:0 0 18px #00f7ff;
}

.o{
    color:#ff00ea;
    text-shadow:0 0 18px #ff00ea;
}

.winner{
    animation:winnerPulse 0.8s infinite alternate;
    border-color:#00ff95 !important;
}

@keyframes winnerPulse{
    from{transform:scale(1);}
    to{transform:scale(1.08);}
}

.controls{
    width:100%;
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-top:12px;
}

button{
    border:none;
    outline:none;
    padding:14px 22px;
    border-radius:18px;
    cursor:pointer;
    color:white;
    font-size:1rem;
    font-weight:bold;
    transition:0.25s ease;
    min-width:140px;
}

button:hover{
    transform:scale(1.05);
}

.restart-btn{
    background:linear-gradient(90deg,#0072ff,#00c6ff);
    box-shadow:0 0 18px rgba(0,198,255,0.35);
}

.mode-btn{
    background:linear-gradient(90deg,#ff0080,#7928ca);
    box-shadow:0 0 18px rgba(255,0,128,0.35);
}

.scoreboard{
    width:100%;
    display:flex;
    justify-content:space-between;
    margin-top:15px;
    gap:10px;
}

.score{
    flex:1;
    background:rgba(255,255,255,0.05);
    padding:14px;
    border-radius:18px;
    text-align:center;
    border:1px solid rgba(255,255,255,0.08);
}

.score h2{
    font-size:1rem;
    margin-bottom:5px;
}

.score p{
    font-size:1.4rem;
    font-weight:bold;
}

.footer{
    margin-top:15px;
    text-align:center;
    font-size:0.9rem;
    color:rgba(255,255,255,0.6);
}

@media(max-width:600px){

    .game-box{
        width:100%;
        height:100vh;
        border-radius:0;
        padding:18px 14px;
    }

    .board{
        width:100%;
        gap:10px;
    }

    .cell{
        border-radius:18px;
    }

    button{
        flex:1;
        min-width:unset;
    }

    .scoreboard{
        flex-direction:row;
    }
}
</style>
</head>

<body>

<div class="game-wrapper">

<div class="game-box">

<div class="title">
<h1>NEON ORBIT</h1>
<p>Futuristic Tic Tac Toe Experience | Developer- Durgesh Kaiwart ✨</p>
</div>

<div class="status" id="status">Player X Turn</div>

<div class="board" id="board">
<div class="cell" data-index="0"></div>
<div class="cell" data-index="1"></div>
<div class="cell" data-index="2"></div>
<div class="cell" data-index="3"></div>
<div class="cell" data-index="4"></div>
<div class="cell" data-index="5"></div>
<div class="cell" data-index="6"></div>
<div class="cell" data-index="7"></div>
<div class="cell" data-index="8"></div>
</div>

<div class="controls">
<button class="restart-btn" onclick="restartGame()">Restart Game</button>
<button class="mode-btn" onclick="toggleMode()">Vs Computer</button>
</div>

<div class="scoreboard">
<div class="score">
<h2>Player X</h2>
<p id="xScore">0</p>
</div>

<div class="score">
<h2>Draw</h2>
<p id="drawScore">0</p>
</div>

<div class="score">
<h2>Player O</h2>
<p id="oScore">0</p>
</div>
</div>

<div class="footer">
Full Screen Mobile Friendly Neon Game UI 🚀
</div>

</div>
</div>

<script>
const cells = document.querySelectorAll('.cell');
const statusText = document.getElementById('status');
const xScoreText = document.getElementById('xScore');
const oScoreText = document.getElementById('oScore');
const drawScoreText = document.getElementById('drawScore');

let currentPlayer = 'X';
let board = ['', '', '', '', '', '', '', '', ''];
let gameActive = true;
let vsComputer = false;

let scores = {
    X:0,
    O:0,
    draw:0
};

const winPatterns = [
    [0,1,2],
    [3,4,5],
    [6,7,8],
    [0,3,6],
    [1,4,7],
    [2,5,8],
    [0,4,8],
    [2,4,6]
];

cells.forEach(cell=>{
    cell.addEventListener('click',handleClick);
});

function handleClick(e){

    const index = e.target.dataset.index;

    if(board[index] !== '' || !gameActive) return;

    makeMove(index,currentPlayer);

    if(vsComputer && gameActive && currentPlayer === 'O'){
        setTimeout(computerMove,500);
    }
}

function makeMove(index,player){

    board[index] = player;
    cells[index].textContent = player;
    cells[index].classList.add(player.toLowerCase());

    checkWinner();

    if(gameActive){
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        statusText.textContent = `Player ${currentPlayer} Turn`;
    }
}

function checkWinner(){

    for(let pattern of winPatterns){

        const [a,b,c] = pattern;

        if(board[a] && board[a] === board[b] && board[a] === board[c]){

            gameActive = false;

            cells[a].classList.add('winner');
            cells[b].classList.add('winner');
            cells[c].classList.add('winner');

            statusText.textContent = `🎉 Player ${board[a]} Wins!`;

            scores[board[a]]++;
            updateScores();

            return;
        }
    }

    if(!board.includes('')){
        gameActive = false;
        statusText.textContent = '🤝 Match Draw!';
        scores.draw++;
        updateScores();
    }
}

function computerMove(){

    let emptyCells = board
    .map((cell,index)=> cell === '' ? index : null)
    .filter(index => index !== null);

    if(emptyCells.length === 0) return;

    let randomMove = emptyCells[Math.floor(Math.random()*emptyCells.length)];

    makeMove(randomMove,'O');
}

function restartGame(){

    board = ['', '', '', '', '', '', '', '', ''];
    gameActive = true;
    currentPlayer = 'X';

    cells.forEach(cell=>{
        cell.textContent='';
        cell.classList.remove('x','o','winner');
    });

    statusText.textContent = 'Player X Turn';
}

function toggleMode(){

    vsComputer = !vsComputer;

    const btn = document.querySelector('.mode-btn');

    btn.textContent = vsComputer ? '2 Players' : 'Vs Computer';

    restartGame();
}

function updateScores(){
    xScoreText.textContent = scores.X;
    oScoreText.textContent = scores.O;
    drawScoreText.textContent = scores.draw;
}
</script>

</body>
</html>
